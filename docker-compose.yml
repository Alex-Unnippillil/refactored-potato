# Disposable local development only. Do not use this password in production.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rolecraft
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: rolecraft
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - rolecraft-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rolecraft -d rolecraft']
      interval: 5s
      timeout: 5s
      retries: 15
volumes:
  rolecraft-postgres:
