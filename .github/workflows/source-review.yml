name: Export source for release review
on:
  push:
    branches: [feat/scheduled-source-refresh]
    paths: ['.github/workflows/source-review.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Export tracked source only
        run: git archive --format=zip --output=/tmp/rolecraft-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: rolecraft-source
          path: /tmp/rolecraft-source.zip
          retention-days: 1
          if-no-files-found: error
