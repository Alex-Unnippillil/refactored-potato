name: Verify Rolecraft 1.3 candidate
on:
  push:
    branches: [feat/search-reliability-1-3]
permissions:
  contents: write
concurrency:
  group: rolecraft-search-release-candidate
  cancel-in-progress: false
jobs:
  verify:
    if: >-
      github.ref == 'refs/heads/feat/search-reliability-1-3' && (github.event.head_commit.message == 'release: verify search reliability candidate' || startsWith(github.event.head_commit.message, 'candidate:'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rolecraft_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d rolecraft_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rolecraft_test
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Verify and apply source-only release patch
        if: hashFiles('.delivery/manifest.json') != ''
        run: |
          python - <<'PYTHON'
          import base64, hashlib, json, lzma, subprocess
          from pathlib import Path
          m=json.loads(Path('.delivery/manifest.json').read_text())
          assert m['base']=='c0156903b9bb43e0b0438e8fc99d59017330aa65'
          assert 1 <= m['parts'] <= 8 and 1 <= len(m['files']) <= 60
          encoded=''.join(Path(f'.delivery/part-{i}.b64').read_text().strip() for i in range(m['parts']))
          assert hashlib.sha256(encoded.encode()).hexdigest()==m['sha256']
          patch=lzma.decompress(base64.b64decode(encoded,validate=True),memlimit=134217728)
          assert len(patch)<500000
          for name in m['files']:
              path=Path(name)
              assert not path.is_absolute() and '..' not in path.parts and not path.is_symlink()
              assert not any(parent.is_symlink() for parent in path.parents)
              assert path.parts[0] in ('app.py','CHANGELOG.md','README.md','docs','public','rolecraft','scripts','tests')
          listing=subprocess.check_output(['git','apply','--numstat','--unidiff-zero','-'],input=patch).decode().splitlines()
          assert {line.split('\t',2)[2] for line in listing}==set(m['files'])
          subprocess.run(['git','apply','--check','--unidiff-zero','-'],input=patch,check=True)
          subprocess.run(['git','apply','--unidiff-zero','-'],input=patch,check=True)
          for name,checksum in m['files'].items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==checksum,name
          print('Verified all source checksums. No secret or workflow paths in source patch.')
          PYTHON
          rm -rf .delivery
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'build: expand checksum-verified source for candidate testing'
          git push origin HEAD:feat/search-reliability-1-3
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate Python, API and PostgreSQL contracts
        run: |
          python -m compileall -q app.py rolecraft scripts
          python -m pytest tests --ignore=tests/test_ui.py --ignore=tests/test_schedules_ui.py --ignore=tests/test_reliability_ui.py -q
          python scripts/evaluate.py
          node --check public/app.js
          node --check public/operations.js
      - name: Install browser engines
        run: python -m playwright install --with-deps chromium firefox webkit
      - name: Verify HTTP application in Chromium, Firefox and WebKit
        run: |
          python -m uvicorn app:app --host 127.0.0.1 --port 8000 > /tmp/rolecraft-server.log 2>&1 &
          python - <<'PY'
          import time, urllib.request
          for i in range(30):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)
                  break
              except Exception:
                  if i == 29: raise
                  time.sleep(1)
          PY
          for browser in chromium firefox webkit; do
            RUN_UI_TESTS=1 TEST_BROWSER="$browser" python -m pytest tests/test_ui.py tests/test_schedules_ui.py tests/test_reliability_ui.py -q || exit 1
          done
      - name: Capture actual HTTP screenshots
        run: |
          python scripts/capture_screenshots.py
          python scripts/render_architecture.py
          mkdir -p artifacts/screenshots
          cp docs/assets/*.png docs/assets/capture.json docs/assets/architecture.svg artifacts/screenshots/
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: rolecraft-screenshots
          path: artifacts/screenshots
          if-no-files-found: error
      - name: Build and verify the non-root container
        run: |
          docker build -t rolecraft:ci .
          docker run -d --name rolecraft-smoke --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true -p 127.0.0.1:8001:8000 rolecraft:ci
          python - <<'PYTHON'
          import time, httpx
          for attempt in range(40):
              try:
                  r=httpx.get('http://127.0.0.1:8001/api/readiness')
                  assert r.status_code==200 and r.json()['mode']=='demo'
                  break
              except Exception:
                  if attempt==39: raise
                  time.sleep(1)
          assert httpx.get('http://127.0.0.1:8001/operations').status_code==200
          r=httpx.post('http://127.0.0.1:8001/api/search',json={'query':'python'})
          assert r.status_code==200 and r.json()['jobs']
          PYTHON
          test "$(docker exec rolecraft-smoke id -u)" = 10001
          docker rm -f rolecraft-smoke
      - name: Publish tested source and actual screenshots to feature branch
        run: |
          rm -rf .delivery
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'feat: search reliability, source evidence and actual browser screenshots'
          git push origin HEAD:feat/search-reliability-1-3
          echo "Verified feature commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Package verified tracked source
        run: git archive --format=zip --output=artifacts/rolecraft-source.zip HEAD
      - name: Upload verified source bundle
        uses: actions/upload-artifact@v4
        with:
          name: rolecraft-source
          path: artifacts/rolecraft-source.zip
          retention-days: 14
          if-no-files-found: error
      - name: Include sanitized server log on failure
        if: failure()
        run: test ! -f /tmp/rolecraft-server.log || tail -n 100 /tmp/rolecraft-server.log
