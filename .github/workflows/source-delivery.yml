name: Verified source delivery
on:
  push:
    branches: [main]
    paths: ['.delivery/source.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rolecraft-source-delivery
  cancel-in-progress: false
jobs:
  deliver:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rolecraft_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d rolecraft_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rolecraft_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify and unpack the source-only delivery
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma
          from pathlib import Path
          manifest = json.loads(Path('.delivery/source.json').read_text())
          assert 1 <= len(manifest['parts']) <= 30
          pieces = []
          for i, checksum in enumerate(manifest['parts']):
              piece = Path(f'.delivery/source-{i:02}.b64').read_text().strip()
              assert hashlib.sha256(piece.encode()).hexdigest() == checksum, f'Transport checksum mismatch: part {i}'
              pieces.append(piece)
          archive = base64.b64decode(''.join(pieces), validate=True)
          assert hashlib.sha256(archive).hexdigest() == manifest['sha256'], 'Archive checksum mismatch'
          files = json.loads(lzma.decompress(archive, memlimit=134217728))
          assert isinstance(files, dict) and 10 <= len(files) <= 100
          assert sum(len(v) for v in files.values()) < 2000000
          for name, text in files.items():
              path = Path(name)
              assert isinstance(text, str) and not path.is_absolute() and '..' not in path.parts
              assert path.parts[0] not in ('.git', '.github', '.vercel', '.delivery')
              assert not path.name.startswith('.env') or path.name == '.env.example'
              assert not path.is_symlink()
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(text, encoding='utf-8')
          print(f'Verified {len(files)} source files; no credentials or workflows unpacked.')
          PY
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate Python, API and real PostgreSQL contracts
        run: |
          python -m compileall -q app.py rolecraft scripts
          python -m pytest tests/test_core.py tests/test_api.py tests/test_providers.py tests/test_postgres.py -q
          python scripts/evaluate.py
          node --check public/app.js
      - name: Install browser engines
        run: python -m playwright install --with-deps chromium firefox webkit
      - name: Verify the actual HTTP application in three browsers
        run: |
          python -m uvicorn app:app --host 127.0.0.1 --port 8000 > /tmp/rolecraft-server.log 2>&1 &
          python - <<'PY'
          import time, urllib.request
          for i in range(30):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)
                  break
              except Exception:
                  if i == 29: raise
                  time.sleep(1)
          PY
          for browser in chromium firefox webkit; do
            RUN_UI_TESTS=1 TEST_BROWSER="$browser" python -m pytest tests/test_ui.py -q || exit 1
          done
      - name: Publish only after all checks pass
        run: |
          rm .delivery/source.json .delivery/source-*.b64
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: ship Rolecraft hybrid RAG job-search workspace'
          git push origin HEAD:main
          echo "Published verified source commit $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
